<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Strategic Research Radar — 매일 전략·학술 논문 인텔리전스</title>
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-sub: #f1f5f9;
      --text: #0f172a;
      --text-muted: #475569;
      --border: #e2e8f0;
      --primary: #1e3a8a;
      --primary-hover: #1e40af;
      --accent: #0284c7;
      --badge-bg: #eff6ff;
      --badge-text: #1d4ed8;
      --score-high: #059669;
      --shadow: 0 4px 20px rgba(15, 23, 42, 0.06);
    }
    [data-theme="dark"] {
      --bg: #0b1120;
      --surface: #111827;
      --surface-sub: #1e293b;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --border: #1e293b;
      --primary: #3b82f6;
      --primary-hover: #60a5fa;
      --accent: #38bdf8;
      --badge-bg: #1e293b;
      --badge-text: #60a5fa;
      --score-high: #10b981;
      --shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.65;
      padding-bottom: 80px;
      transition: background 0.2s, color 0.2s;
    }
    .container { max-width: 1120px; margin: 0 auto; padding: 0 20px; }
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 24px 0;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 18px;
    }
    .brand h1 { font-size: 1.35rem; font-weight: 800; letter-spacing: -0.02em; color: var(--primary); }
    .brand p { font-size: 0.85rem; color: var(--text-muted); }
    .header-actions { display: flex; gap: 8px; align-items: center; }
    button {
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.15s;
    }
    button:hover { background: var(--surface-sub); }
    button.btn-primary {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    button.btn-primary:hover { background: var(--primary-hover); }
    .search-panel {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      background: var(--surface-sub);
      padding: 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }
    .search-panel input {
      flex: 1;
      min-width: 240px;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 0.92rem;
    }
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin: 22px 0;
      padding: 12px 18px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 0.86rem;
    }
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
      color: var(--score-high);
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--score-high); }
    .paper-list { display: flex; flex-direction: column; gap: 24px; }
    .paper-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
      box-shadow: var(--shadow);
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .venue-badge {
      display: inline-block;
      background: var(--badge-bg);
      color: var(--badge-text);
      font-weight: 700;
      font-size: 0.78rem;
      padding: 4px 10px;
      border-radius: 6px;
      margin-bottom: 8px;
    }
    .korean-title { font-size: 1.25rem; font-weight: 800; line-height: 1.4; margin-bottom: 4px; }
    .orig-title { font-size: 0.88rem; color: var(--text-muted); font-style: italic; }
    .score-box {
      min-width: 190px;
      background: var(--surface-sub);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      text-align: right;
    }
    .total-score { font-size: 1.4rem; font-weight: 800; color: var(--score-high); }
    .sub-scores { font-size: 0.76rem; color: var(--text-muted); margin-top: 4px; line-height: 1.4; }
    .eval-comment {
      background: var(--badge-bg);
      border-left: 4px solid var(--primary);
      padding: 10px 14px;
      border-radius: 0 8px 8px 0;
      font-size: 0.88rem;
      font-weight: 600;
      margin-bottom: 18px;
    }
    .analysis-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 14px;
      margin-bottom: 18px;
    }
    .analysis-item {
      background: var(--surface-sub);
      padding: 14px 16px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }
    .analysis-item h4 {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: var(--primary);
      margin-bottom: 6px;
    }
    .analysis-item p { font-size: 0.9rem; }
    .insight-highlight {
      grid-column: 1 / -1;
      border-color: var(--accent);
    }
    .meta-footer {
      border-top: 1px solid var(--border);
      padding-top: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 0.82rem;
      color: var(--text-muted);
    }
    .link-group { display: flex; gap: 8px; flex-wrap: wrap; }
    .link-btn {
      text-decoration: none;
      color: var(--text);
      background: var(--surface-sub);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.8rem;
    }
    .link-btn:hover { border-color: var(--primary); color: var(--primary); }
    .abstract-drawer, .citation-drawer {
      display: none;
      margin-top: 14px;
      padding: 16px;
      background: var(--surface-sub);
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 0.85rem;
    }
    .abstract-drawer.open, .citation-drawer.open { display: block; }
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.65);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      max-width: 520px;
      width: 100%;
      padding: 24px;
    }
    .modal h3 { margin-bottom: 10px; font-size: 1.15rem; }
    .modal p { font-size: 0.86rem; color: var(--text-muted); margin-bottom: 14px; }
    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 0.82rem; font-weight: 700; margin-bottom: 4px; }
    .field input {
      width: 100%;
      padding: 9px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface-sub);
      color: var(--text);
    }
    .loading-box {
      text-align: center;
      padding: 60px 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
    }
  </style>
</head>
<body>
  <header>
    <div class="container">
      <div class="header-top">
        <div class="brand">
          <h1>STRATEGIC RESEARCH RADAR</h1>
          <p>매일 자동 수집·전문성 정량 평가 기반 경영·기술 논문 인텔리전스</p>
        </div>
        <div class="header-actions">
          <select id="archiveSelect" style="padding:8px 10px; border-radius:8px; border:1px solid var(--border); background:var(--surface); color:var(--text); font-size:0.84rem;">
            <option value="latest">최신 브리핑 불러오는 중...</option>
          </select>
          <button onclick="openSettings()">⚙️ API·키워드 영구연동 설정</button>
          <button onclick="toggleTheme()">🌓 테마</button>
        </div>
      </div>

      <div class="search-panel">
        <input type="text" id="keywordInput" placeholder="새 관심 키워드 입력 (예: M&A strategy, generative AI supply chain, omnichannel retail)..." />
        <button class="btn-primary" onclick="runLiveKeywordSearch(false)">🔍 즉시 5편 검색·분석</button>
        <button onclick="runLiveKeywordSearch(true)" title="내일 아침 7시 자동화 기준 키워드까지 함께 변경합니다">💾 검색 + 내일부터 기본 키워드로 고정</button>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="status-bar">
      <div>
        <span class="status-pill"><span class="dot"></span> 적용 키워드: <span id="activeKeyword">-</span></span>
      </div>
      <div style="color: var(--text-muted);">
        마지막 업데이트: <strong id="updatedAt">-</strong> | 선정 논문: <strong id="paperCount">0</strong>편
      </div>
    </div>

    <div id="paperContainer" class="paper-list">
      <div class="loading-box">데이터를 불러오는 중입니다...</div>
    </div>
  </main>

  <!-- 설정 모달 -->
  <div id="settingsModal" class="modal-backdrop">
    <div class="modal">
      <h3>⚙️ 개인 전용 실시간 검색 및 자동화 연동 설정</h3>
      <p>입력하신 키는 외부 서버로 전송되지 않고 오직 본인 브라우저(localStorage)에만 안전하게 저장됩니다.</p>
      <div class="field">
        <label>1. Google Gemini API Key (웹에서 즉시 5편 요약용)</label>
        <input type="password" id="geminiKeyInput" placeholder="AQ... 또는 AIza..." />
      </div>
      <div class="field">
        <label>2. GitHub Personal Access Token (내일 아침 기본 키워드 영구 변경용, repo 권한)</label>
        <input type="password" id="githubTokenInput" placeholder="ghp_... (선택사항)" />
      </div>
      <div class="field">
        <label>3. GitHub 저장소 경로 (예: c65106736-netizen/daily-paper-briefing)</label>
        <input type="text" id="repoPathInput" placeholder="아이디/저장소이름" />
      </div>
      <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:18px;">
        <button onclick="closeSettings()">닫기</button>
        <button class="btn-primary" onclick="saveSettings()">설정 저장</button>
      </div>
    </div>
  </div>

  <script>
    let archiveData = [];

    function toggleTheme() {
      const current = document.documentElement.getAttribute("data-theme");
      const next = current === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      localStorage.setItem("theme", next);
    }
    if (localStorage.getItem("theme") === "dark") {
      document.documentElement.setAttribute("data-theme", "dark");
    }

    function openSettings() {
      document.getElementById("geminiKeyInput").value = localStorage.getItem("gemini_api_key") || "";
      document.getElementById("githubTokenInput").value = localStorage.getItem("github_pat") || "";
      document.getElementById("repoPathInput").value = localStorage.getItem("github_repo") || "c65106736-netizen/daily-paper-briefing";
      document.getElementById("settingsModal").classList.add("open");
    }
    function closeSettings() {
      document.getElementById("settingsModal").classList.remove("open");
    }
    function saveSettings() {
      localStorage.setItem("gemini_api_key", document.getElementById("geminiKeyInput").value.trim());
      localStorage.setItem("github_pat", document.getElementById("githubTokenInput").value.trim());
      localStorage.setItem("github_repo", document.getElementById("repoPathInput").value.trim());
      alert("설정이 브라우저에 저장되었습니다.");
      closeSettings();
    }

    async function loadInitialData() {
      try {
        const res = await fetch("./data/latest.json?t=" + Date.now());
        if (!res.ok) throw new Error("아직 첫 자동 수집이 실행되지 않았습니다.");
        const latest = await res.json();
        renderBriefing(latest);

        const archRes = await fetch("./data/archive.json?t=" + Date.now());
        if (archRes.ok) {
          archiveData = await archRes.json();
          const select = document.getElementById("archiveSelect");
          select.innerHTML = archiveData.map((item, idx) =>
            `<option value="${idx}">${item.updated_at} (${item.keyword})</option>`
          ).join("");
          select.onchange = (e) => renderBriefing(archiveData[e.target.value]);
        }
      } catch (err) {
        document.getElementById("paperContainer").innerHTML = `
          <div class="loading-box">
            <h3>첫 데이터 생성 대기 중</h3>
            <p style="margin-top:8px; color:var(--text-muted);">
              GitHub 저장소의 <strong>Actions → Daily Strategic Paper Pipeline → Run workflow</strong>를 한 번 실행하면 첫 5편의 논문 리포트가 생성됩니다.<br/>
              또는 우측 상단 <strong>[⚙️ API·키워드 영구연동 설정]</strong>에 Gemini API 키를 입력하고 위 검색창에서 바로 논문을 조회할 수 있습니다.
            </p>
          </div>`;
      }
    }

    function renderBriefing(data) {
      document.getElementById("activeKeyword").textContent = data.keyword || "-";
      document.getElementById("keywordInput").value = data.keyword || "";
      document.getElementById("updatedAt").textContent = data.updated_at || "-";
      document.getElementById("paperCount").textContent = (data.papers || []).length;

      const container = document.getElementById("paperContainer");
      if (!data.papers || data.papers.length === 0) {
        container.innerHTML = `<div class="loading-box">표시할 논문 데이터가 없습니다.</div>`;
        return;
      }

      container.innerHTML = data.papers.map((p, i) => `
        <article class="paper-card">
          <div class="card-top">
            <div style="flex:1; min-width:260px;">
              <span class="venue-badge">#${i + 1} · ${escapeHtml(p.venue)} (${p.year}) · 피인용 ${p.citation_count}회</span>
              <h2 class="korean-title">${escapeHtml(p.korean_title)}</h2>
              <div class="orig-title">${escapeHtml(p.original_title)}</div>
            </div>
            <div class="score-box">
              <div class="total-score">전문성 ${p.total_score}점 <span style="font-size:0.8rem; font-weight:500;">/100</span></div>
              <div class="sub-scores">
                저널 권위: <strong>${p.journal_authority}</strong> · 방법론: <strong>${p.methodology_rigor}</strong><br/>
                실무 파급력: <strong>${p.practical_impact}</strong>
              </div>
            </div>
          </div>

          <div class="eval-comment">💡 애널리스트 총평: ${escapeHtml(p.evaluation_comment)}</div>

          <div class="analysis-grid">
            <div class="analysis-item">
              <h4>1. 핵심 연구 가설 및 목적</h4>
              <p>${escapeHtml(p.core_hypothesis)}</p>
            </div>
            <div class="analysis-item">
              <h4>2. 연구 방법론 및 데이터</h4>
              <p>${escapeHtml(p.methodology)}</p>
            </div>
            <div class="analysis-item">
              <h4>3. 주요 실증 결과</h4>
              <p>${escapeHtml(p.key_findings)}</p>
            </div>
            <div class="analysis-item">
              <h4>4. 연구 한계 및 반론 포인트</h4>
              <p>${escapeHtml(p.limitations)}</p>
            </div>
            <div class="analysis-item insight-highlight">
              <h4>5. 기업 기획·전략 실무 적용 인사이트</h4>
              <p>${escapeHtml(p.strategic_insight)}</p>
            </div>
          </div>

          <div class="meta-footer">
            <div>
              <strong>저자:</strong> ${escapeHtml((p.authors || []).join(", "))}
              ${p.doi ? ` · <strong>DOI:</strong> ${escapeHtml(p.doi)}` : ""}
            </div>
            <div class="link-group">
              <button onclick="toggleDrawer('abs-${i}')">📄 영문 원문(Abstract) 보기</button>
              <button onclick="toggleDrawer('cit-${i}')">📚 출처 및 APA 인용 복사</button>
              ${p.url ? `<a class="link-btn" href="${escapeAttr(p.url)}" target="_blank" rel="noopener">🔗 원문 페이지</a>` : ""}
              ${p.pdf_url ? `<a class="link-btn" href="${escapeAttr(p.pdf_url)}" target="_blank" rel="noopener">📥 무료 PDF</a>` : ""}
            </div>
          </div>

          <div id="abs-${i}" class="abstract-drawer">
            <strong>[Original English Abstract]</strong><br/><br/>
            ${escapeHtml(p.original_abstract)}
          </div>
          <div id="cit-${i}" class="citation-drawer">
            <strong>[APA 7th Citation]</strong><br/>
            <p id="apa-text-${i}" style="margin:8px 0; font-family:monospace;">${escapeHtml(p.apa_citation)}</p>
            <button onclick="copyCitation('apa-text-${i}')">📋 인용 문구 복사</button>
          </div>
        </article>
      `).join("");
    }

    function toggleDrawer(id) {
      document.getElementById(id).classList.toggle("open");
    }

    function copyCitation(elId) {
      const text = document.getElementById(elId).textContent;
      navigator.clipboard.writeText(text);
      alert("APA 인용 출처가 복사되었습니다.");
    }

    async function callGeminiWithFallback(apiKey, prompt) {
      const models = ["gemini-3.0-flash", "gemini-2.0-flash"];
      let lastErr = null;
      for (const m of models) {
        try {
          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent?key=${encodeURIComponent(apiKey)}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              contents: [{ parts: [{ text: prompt }] }],
              generationConfig: { responseMimeType: "application/json", temperature: 0.2 }
            })
          });
          const data = await res.json();
          if (data.error) throw new Error(data.error.message);
          return JSON.parse(data.candidates[0].content.parts[0].text);
        } catch (err) {
          lastErr = err;
        }
      }
      throw lastErr;
    }

    async function runLiveKeywordSearch(saveAsDefault) {
      const keyword = document.getElementById("keywordInput").value.trim();
      if (!keyword) return alert("검색할 키워드를 입력해 주세요.");

      const apiKey = localStorage.getItem("gemini_api_key");
      if (!apiKey) {
        alert("웹사이트에서 즉시 검색하려면 먼저 [⚙️ API·키워드 영구연동 설정]에서 Gemini API 키를 입력해 주세요.");
        return openSettings();
      }

      document.getElementById("paperContainer").innerHTML = `
        <div class="loading-box">
          <h3>🔍 "${escapeHtml(keyword)}" 키워드 실시간 학술 DB 검색 및 전문가 평가 중...</h3>
          <p style="margin-top:8px; color:var(--text-muted);">학술 데이터베이스에서 상위 논문을 추출하고 AI 수석 애널리스트가 5편을 정밀 채점하고 있습니다. (약 10~15초 소요)</p>
        </div>`;

      try {
        const oaRes = await fetch(`https://api.openalex.org/works?search=${encodeURIComponent(keyword)}&per-page=12&filter=has_abstract:true&sort=cited_by_count:desc`);
        const oaJson = await oaRes.json();
        const candidates = (oaJson.results || []).map(item => {
          const inv = item.abstract_inverted_index || {};
          const words = {};
          Object.entries(inv).forEach(([w, posList]) => posList.forEach(p => words[p] = w));
          const abstract = Object.keys(words).sort((a,b)=>a-b).map(k => words[k]).join(" ");
          const loc = item.primary_location || {};
          const src = loc.source || {};
          return {
            paper_id: (item.id || "").split("/").pop(),
            title: item.title || "",
            abstract: abstract.slice(0, 2200),
            authors: (item.authorships || []).slice(0, 5).map(a => a.author?.display_name).filter(Boolean),
            venue: src.display_name || "Academic Journal",
            year: item.publication_year || 2025,
            citation_count: item.cited_by_count || 0,
            doi: (item.doi || "").replace("https://doi.org/", ""),
            url: item.doi || loc.landing_page_url || "",
            pdf_url: loc.pdf_url || ""
          };
        }).filter(c => c.abstract.length > 100);

        if (candidates.length === 0) throw new Error("해당 키워드로 초록이 공개된 논문을 찾지 못했습니다. 영문 키워드로 다시 시도해 보세요.");

        const prompt = `당신은 글로벌 전략컨설팅 펌의 수석 애널리스트입니다. 키워드 "${keyword}"에 대해 아래 논문 후보 중 전문성과 실무 가치가 가장 높은 5편을 선정해 JSON으로만 응답하세요.
후보: ${JSON.stringify(candidates.slice(0, 10))}
반드시 다음 JSON 구조를 지키세요:
{"papers":[{"paper_id":"","original_title":"","korean_title":"","authors":[""],"venue":"","year":2025,"citation_count":0,"doi":"","url":"","pdf_url":"","total_score":92,"journal_authority":90,"methodology_rigor":91,"practical_impact":95,"evaluation_comment":"","core_hypothesis":"","methodology":"","key_findings":"","strategic_insight":"","limitations":"","original_abstract":"후보 영문 초록 원문 그대로","apa_citation":""}]}`;

        const parsed = await callGeminiWithFallback(apiKey, prompt);
        const nowStr = new Date().toLocaleString("ko-KR") + " (실시간 조회)";
        renderBriefing({
          updated_at: nowStr,
          keyword: keyword,
          papers: parsed.papers || []
        });

        if (saveAsDefault) {
          await updateGitHubDefaultKeyword(keyword);
        }
      } catch (err) {
        document.getElementById("paperContainer").innerHTML = `
          <div class="loading-box" style="color:#dc2626;">
            <h3>검색 중 오류가 발생했습니다</h3>
            <p style="margin-top:8px;">${escapeHtml(err.message)}</p>
          </div>`;
      }
    }

    async function updateGitHubDefaultKeyword(newKeyword) {
      const token = localStorage.getItem("github_pat");
      const repo = localStorage.getItem("github_repo");
      if (!token || !repo) {
        alert("검색 결과는 화면에 표시되었으나, GitHub 토큰이 설정되지 않아 내일 아침 기본 키워드 저장은 건너뛰었습니다. [⚙️ 설정]에서 GitHub 토큰을 등록해 주세요.");
        return;
      }
      try {
        const apiUrl = `https://api.github.com/repos/${repo}/contents/keywords.json`;
        const getRes = await fetch(apiUrl, { headers: { Authorization: `Bearer ${token}` } });
        const fileInfo = await getRes.json();
        const updatedContent = btoa(unescape(encodeURIComponent(JSON.stringify({ keyword: newKeyword, papers_per_day: 5 }, null, 2))));

        const putRes = await fetch(apiUrl, {
          method: "PUT",
          headers: {
            Authorization: `Bearer ${token}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: `chore: update default keyword to "${newKeyword}" from dashboard`,
            content: updatedContent,
            sha: fileInfo.sha
          })
        });
        if (putRes.ok) {
          alert(`✅ 내일 아침 7시 자동화 기본 키워드도 "${newKeyword}"로 영구 변경되었습니다!`);
        } else {
          alert("GitHub 기본 키워드 저장에 실패했습니다. 토큰 권한(repo)을 확인해 주세요.");
        }
      } catch (e) {
        alert("GitHub 연동 오류: " + e.message);
      }
    }

    function escapeHtml(str) {
      return String(str || "").replace(/[&<>"']/g, m => ({ "&": "&", "<": "<", ">": ">", '"': """, "'": "'" }[m]));
    }
    function escapeAttr(str) {
      return String(str || "").replace(/"/g, """);
    }

    loadInitialData();
  </script>
</body>
